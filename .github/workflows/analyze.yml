name: Hourly Observe & Analyze

on:
  schedule:
    - cron: '0 * * * *'  # Every hour
  workflow_dispatch: {}    # Manual trigger

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install supabase pandas networkx matplotlib

      - name: Trigger observation (fetch new Moltbook data)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl -s -X POST \
            "${SUPABASE_URL}/functions/v1/observe" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" \
            || echo "Observe failed (may not be deployed yet)"

      - name: Run analysis pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python sync_and_analyze.py
